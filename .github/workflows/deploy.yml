name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update server checkout
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' 'leeharkness.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAcyDW9yQ6xlmHRlXEL2TgD54qxeesEDL2FOgi5D3A90' > "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/deploy_key" -p 22 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            lee@leeharkness.com 'deploy'
