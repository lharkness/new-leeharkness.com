<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A small website explored from a command prompt.">
  <title>Terminal</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23101312'/%3E%3Cpath d='m8 10 6 6-6 6m9 0h7' fill='none' stroke='%2398e6ad' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="terminal.css">
  <script src="terminal.js" defer></script>
</head>
<body>
  <main id="terminal" aria-label="Website terminal">
    <div id="output" role="log" aria-live="polite" aria-relevant="additions"></div>
    <form id="command-form" autocomplete="off">
      <label for="command" class="prompt">visitor@leeharkness.com:~$<span class="sr-only"> Command (type help for commands)</span></label>
      <input id="command" name="command" type="text" autofocus autocapitalize="off" spellcheck="false" aria-label="Command; type help for commands">
    </form>
  </main>
  <noscript>This terminal needs JavaScript enabled.</noscript>
</body>
</html>
